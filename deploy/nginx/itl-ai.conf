# Nginx reverse proxy for ITL AI (TanStack Start SSR) on Windows Server 2019
#
# Place this file at:  C:\nginx\conf\conf.d\itl-ai.conf
# and make sure C:/nginx/conf/nginx.conf contains, inside `http { ... }`:
#     include conf.d/*.conf;
#
# The app is SSR: Node serves HTML on 127.0.0.1:3000 (see ecosystem.config.cjs).
# Nginx terminates TLS, serves the hashed client assets straight from disk, and
# proxies everything else to Node.

upstream itl_ai_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- gzip (Nginx for Windows ships without brotli) ----
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/xml image/svg+xml font/woff font/woff2 application/manifest+json;

server {
    listen 80;
    server_name itl.example.com;
    # Redirect to HTTPS once certificates are installed.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name itl.example.com;

    ssl_certificate     C:/nginx/ssl/itl-ai.crt;
    ssl_certificate_key C:/nginx/ssl/itl-ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Root points at the built client output so Nginx can serve assets itself.
    root C:/apps/itl-ai/current/dist/client;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Immutable, content-hashed build assets ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ---- Other static files that exist on disk (favicon, robots, images) ----
    location ~* \.(ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|txt|webmanifest)$ {
        try_files $uri @app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- Everything else is server-rendered by Node ----
    # NOTE: this is SSR, so there is NO SPA `try_files ... /index.html` fallback.
    # Deep links and refreshes are handled by the Node server itself.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass         http://itl_ai_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering    off;   # keep SSR streaming responsive
    }
}
